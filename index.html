<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Math Calculator</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        transition: background 0.5s ease;
      }
      .container {
        width: 400px;
        text-align: center;
      }
      .calculator,
      .history-page {
        display: none; /* Hidden by default */
      }
      .calculator.active,
      .history-page.active {
        display: block; /* Show active view */
      }
      .calculator {
        background-color: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
        animation: fadeIn 1s ease-in-out;
        transition: background-color 0.5s ease, color 0.5s ease;
        position: relative; /* For positioning the dropdown */
      }
      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 20px;
      }
      input[type="number"] {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }
      input[type="number"]:focus {
        border-color: #007bff;
        outline: none;
      }
      select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }
      select:focus {
        border-color: #007bff;
        outline: none;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #0056b3;
      }
      .result {
        margin-top: 20px;
        font-size: 20px;
        color: #333;
        font-weight: bold;
      }
      .history {
        margin-top: 20px;
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        background-color: #f9f9f9;
      }
      .back-button {
        margin-top: 20px;
        background-color: #ff4d4d;
      }
      .back-button:hover {
        background-color: #cc0000;
      }

      /* More Menu Styles */
      .more-menu {
        position: absolute;
        top: 15px;
        right: 15px;
        cursor: pointer;
        font-size: 24px;
        color: #333;
      }
      .dropdown-menu {
        position: absolute;
        top: 50px;
        right: 15px;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 10;
        animation: fadeIn 0.3s ease-in-out;
      }
      .dropdown-menu button {
        width: 100%;
        padding: 10px;
        text-align: left;
        border: none;
        background-color: transparent;
        cursor: pointer;
        font-size: 16px;
        color: #333; /* Text color for light mode */
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dropdown-menu button:hover {
        background-color: #f0f0f0;
      }

      /* Dark Mode */
      .dark-mode {
        background: linear-gradient(135deg, #2c3e50, #4ca1af);
      }
      .dark-mode .calculator {
        background-color: #34495e;
        color: #ecf0f1;
      }
      .dark-mode .result {
        color: #ecf0f1;
      }
      .dark-mode .more-menu {
        color: #ecf0f1; /* Icon color in dark mode */
      }
      .dark-mode .dropdown-menu {
        background-color: #34495e; /* Dropdown background in dark mode */
        border-color: #2c3e50;
      }
      .dark-mode .dropdown-menu button {
        color: #ecf0f1; /* Text color for dark mode */
      }
      .dark-mode .dropdown-menu button:hover {
        background-color: #2c3e50; /* Hover effect in dark mode */
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Calculator View -->
      <div class="calculator active" id="calculator-view">
        <!-- More Menu -->
        <div class="more-menu" onclick="toggleDropdown()">...</div>
        <div class="dropdown-menu" id="dropdown-menu">
          <button onclick="showHistory()">Show History</button>
          <button onclick="toggleDarkMode()">Dark Mode</button>
        </div>

        <h1>Advanced Math Calculator</h1>

        <!-- Input fields -->
        <input type="number" id="num1" placeholder="Enter first number" />
        <input
          type="number"
          id="num2"
          placeholder="Enter second number (if needed)"
        />

        <!-- Operation selection -->
        <select id="operation">
          <option value="add">Addition (+)</option>
          <option value="subtract">Subtraction (-)</option>
          <option value="multiply">Multiplication (*)</option>
          <option value="divide">Division (/)</option>
          <option value="exponentiate">Exponentiation (^)</option>
          <option value="modulus">Modulus (%)</option>
          <option value="sqrt">Square Root (√)</option>
          <option value="factorial">Factorial (!)</option>
          <option value="log">Logarithm (ln)</option>
          <option value="log10">Logarithm (base 10)</option>
          <option value="sin">Sine (sin)</option>
          <option value="cos">Cosine (cos)</option>
          <option value="tan">Tangent (tan)</option>
          <option value="abs">Absolute Value (|x|)</option>
          <option value="floor">Floor (⌊x⌋)</option>
          <option value="ceil">Ceiling (⌈x⌉)</option>
          <option value="random">Random Number (0-1)</option>
        </select>

        <!-- Calculate button -->
        <button onclick="calculate()">Calculate</button>

        <!-- Result display -->
        <div class="result" id="result"></div>
      </div>

      <!-- History View -->
      <div class="history-page" id="history-view">
        <h1>History</h1>
        <div class="history" id="history">
          <ul id="history-list"></ul>
        </div>
        <button class="back-button" onclick="goBackToCalculator()">
          Back to Calculator
        </button>
      </div>
    </div>

    <script>
      let historyList = [];
      let isDropdownOpen = false;

      function calculate() {
        // Get input values
        const num1 = parseFloat(document.getElementById("num1").value);
        const num2 = parseFloat(document.getElementById("num2").value);
        const operation = document.getElementById("operation").value;

        let result;

        // Perform the selected operation
        switch (operation) {
          case "add":
            result = num1 + num2;
            break;
          case "subtract":
            result = num1 - num2;
            break;
          case "multiply":
            result = num1 * num2;
            break;
          case "divide":
            if (num2 === 0) {
              result = "Error: Division by zero";
            } else {
              result = num1 / num2;
            }
            break;
          case "exponentiate":
            result = Math.pow(num1, num2);
            break;
          case "modulus":
            result = num1 % num2;
            break;
          case "sqrt":
            if (num1 < 0) {
              result = "Error: Square root of negative number";
            } else {
              result = Math.sqrt(num1);
            }
            break;
          case "factorial":
            if (num1 < 0 || !Number.isInteger(num1)) {
              result = "Error: Factorial only for non-negative integers";
            } else {
              result = factorial(num1);
            }
            break;
          case "log":
            if (num1 <= 0) {
              result = "Error: Logarithm of non-positive number";
            } else {
              result = Math.log(num1);
            }
            break;
          case "log10":
            if (num1 <= 0) {
              result = "Error: Logarithm of non-positive number";
            } else {
              result = Math.log10(num1);
            }
            break;
          case "sin":
            result = Math.sin(num1);
            break;
          case "cos":
            result = Math.cos(num1);
            break;
          case "tan":
            result = Math.tan(num1);
            break;
          case "abs":
            result = Math.abs(num1);
            break;
          case "floor":
            result = Math.floor(num1);
            break;
          case "ceil":
            result = Math.ceil(num1);
            break;
          case "random":
            result = Math.random();
            break;
          default:
            result = "Invalid operation";
        }

        // Display the result
        document.getElementById("result").innerText = `Result: ${result}`;

        // Add to history
        historyList.push(`${num1} ${operation} ${num2 || ""} = ${result}`);
        updateHistory();
      }

      // Function to calculate factorial
      function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let result = 1;
        for (let i = 2; i <= n; i++) {
          result *= i;
        }
        return result;
      }

      // Update history list
      function updateHistory() {
        const historyElement = document.getElementById("history-list");
        historyElement.innerHTML = "";
        historyList.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item;
          historyElement.appendChild(li);
        });
      }

      // Show History Page
      function showHistory() {
        document.getElementById("calculator-view").classList.remove("active");
        document.getElementById("history-view").classList.add("active");
      }

      // Go Back to Calculator Page
      function goBackToCalculator() {
        document.getElementById("history-view").classList.remove("active");
        document.getElementById("calculator-view").classList.add("active");
      }

      // Toggle Dark Mode
      function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        document.querySelector(".calculator").classList.toggle("dark-mode");
      }

      // Toggle Dropdown Menu
      function toggleDropdown() {
        const dropdownMenu = document.getElementById("dropdown-menu");
        if (isDropdownOpen) {
          dropdownMenu.style.display = "none";
        } else {
          dropdownMenu.style.display = "block";
        }
        isDropdownOpen = !isDropdownOpen;
      }

      // Close dropdown when clicking outside
      document.addEventListener("click", (e) => {
        const dropdownMenu = document.getElementById("dropdown-menu");
        const moreMenu = document.querySelector(".more-menu");
        if (!dropdownMenu.contains(e.target) && !moreMenu.contains(e.target)) {
          dropdownMenu.style.display = "none";
          isDropdownOpen = false;
        }
      });

      // Keyboard support (press Enter to calculate)
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          calculate();
        }
      });
    </script>
  </body>
</html>
